name: Build and deploy Node.js app to DigitalOcean - mycompound

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --quiet --eval \"db.adminCommand('ping').ok\" mongodb://localhost:27017/test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Create CI test env
        run: |
          cat > .env.test <<'EOF'
          DATABASE_URL=mongodb://localhost:27017/mycompound_test
          PORT=8000
          ALLOWED_ORIGIN=http://localhost:3000
          API_BASE_URL=http://localhost:8000/api/v1
          JWT_ACCESS_SECRET=test-jwt-access-secret
          JWT_REFRESH_SECRET=test-jwt-refresh-secret
          JWT_ACCESS_EXPIRES_IN=15m
          JWT_REFRESH_EXPIRES_IN=7d
          COOKIE_SECRET=test-cookie-secret
          MAIL_HOST=localhost
          MAIL_PORT=1025
          MAIL_USER=test@example.com
          MAIL_PASS=test-password
          MAIL_FROM=no-reply@mycompound.test
          RESET_TOKEN_SECRET=test-reset-token-secret
          RESET_TOKEN_EXPIRES_IN=15m
          CLIENT_URL=http://localhost:3000
          REDIS_URL=redis://localhost:6379/15
          SHOULD_VERIFY_USER=true
          VERIFICATION_TOKEN_SECRET=test-verification-token-secret
          VERIFICATION_TOKEN_EXPIRES_IN=1d
          EOF

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build --if-present

      - name: Run tests
        run: npm run test:run --if-present

  deploy:
    name: Deploy to DigitalOcean Droplet
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e
            cd ~/deploy/apps/mycompound
            echo "→ Pulling latest code..."
            git pull origin dev
            echo "→ Installing dependencies..."
            npm install --production
            echo "→ Building..."
            npm run build
            echo "→ Reloading processes..."
            pm2 startOrReload pm2.config.cjs --update-env
            echo "→ Saving PM2 state..."
            pm2 save
            echo "✓ Deploy complete"
